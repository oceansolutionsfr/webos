        window.webos = WebOS({
            terms: {
                firm: "Ocean Solutions SAS",
                juridiction: "France",
                photo_credits: "Sébastien Jean Mamy",
                photo_credits_url: "https://sebastien-mamy.fr"
            }, 
            login: false, 
            menu:true, 
            dock:true, 
            pad: true,
            backgroundImage: "./img/US2009CL1051-3648-2736-Arches National Park.webp",
            support_email: "info@oceansolutions.fr",
            // auth_wrapper
        })
 

        webos.add({
            color_top: "#F0F0F0",
            color_bottom: "#B0B0B0",
            icon_src: "./img/dock-calculator.webp",
            id: "calculator",
            url: "./apps/calculator.html",
            single: false,
            winbox_options: {
                width: "400px",
                height: "620px",
            }
        })
       
        webos.add({
            color_top: "rgb(56,34,162)",
            color_bottom: "rgb(115,188,227)",
            icon_src: "./img/material.climate.white.png",
            id: "climate",
            title:"Ocean Climate",
            url: "https://oceansolutions.fr/climate",
            single: true
        })
       
        webos.add({
            color_top: "#F0F0F0",
            color_bottom: "#B0B0B0",
            icon_src: "./img/dock-openstreemap.webp",
            id: "openstreetmap",
            onclick: event => window.open("https://www.openstreetmap.org/#map=14/46.21678/6.14385&layers=P")
        })

        
       
        document.addEventListener("DOMContentLoaded", event => {
            webos.render()
        })

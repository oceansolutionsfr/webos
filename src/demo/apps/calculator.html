<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <style>
            #calculator,body,html{height:100%;width:100%}*,::before{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body,html{margin:0}body{font-family:Verdana,sans-serif;display:flex;justify-content:center;align-items:center;background:#121212}#calculator{padding:25px;border-radius:25px;background:linear-gradient(to bottom right,#404040,#0c0c0c)}#input-wrap{position:relative;width:calc(100% - 4px);margin-bottom:5px;padding:0 5px;background:#a1bd66;text-align:right;box-shadow:inset 0 0 15px 0 rgba(0,0,0,.5)}#input{height:5rem;line-height:5rem;font-size:2rem}#tmp{position:absolute;right:5px;top:.25rem;color:grey}#button-wrap{display:flex;width:100%;flex-wrap:wrap;justify-content:space-around}#button-wrap>button{width:calc(25% - 4px);text-align:center;line-height:5rem;margin:2px 0;background:grey;color:#f1f1f1;border-radius:4px;cursor:pointer;user-select:none;outline:0;transition:.3s}#button-wrap>button.num-0{width:calc(50% - 4px)}#button-wrap>button.number{background:#5d5d5f}#button-wrap>button:hover{box-shadow:inset 0 0 15px 0 rgba(0,0,0,.3)}#button-wrap>button#result{background:#f55530}
        </style>
        
    </head>
    <body>
        <div id="calculator">
            <div id="input-wrap">
                <div id="tmp"></div>
                <div id="input"></div>
            </div>
            <div id="button-wrap">
                <button id="all-clear">AC</button>
                <button id="clear">C</button>
                <button id="sign">+/-</button>
                <button class="amt divide">/</button>
        
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="amt times">*</button>
        
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="amt minus">-</button>
        
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="amt plus">+</button>
        
                <button class="number num-0">0</button>
                <button id="dot">.</button>
                <button id="result">=</button>
            </div>
        </div>        
        <script>
            const input=document.getElementById("input"),tmp=document.getElementById("tmp"),empty=e=>{e.innerText=""};document.getElementById("all-clear").addEventListener("click",()=>{empty(input),empty(tmp)}),document.getElementById("clear").addEventListener("click",()=>{empty(input)}),document.querySelectorAll(".number").forEach(e=>{e.addEventListener("click",()=>{if(input.innerText.length>19)return alert("최대 입력 범위를 초과했습니다!");input.innerText+=e.innerText})}),document.getElementById("dot").addEventListener("click",()=>{input.innerText.includes(".")||(input.innerText+=".")}),document.getElementById("sign").addEventListener("click",()=>{input.innerText.startsWith("-")?input.innerText=input.innerText.slice(1):input.innerText=`-${input.innerText}`}),document.querySelectorAll(".amt").forEach(e=>{e.addEventListener("click",()=>{if(input.innerText)tmp.innerText?tmp.innerText=`${tmp.innerText} ${input.innerText} ${e.innerText}`:tmp.innerText=`${input.innerText} ${e.innerText}`;else if(tmp.innerText.slice(-1).match(/-|\+|\*|\//)){let t=tmp.innerText.slice(0,-1);t+=e.innerText,tmp.innerText=t}empty(input)})}),document.getElementById("result").addEventListener("click",()=>{input.innerText&&(input.innerText=eval(tmp.innerText+input.innerText),empty(tmp))});
        </script>
    </body>
</html>
